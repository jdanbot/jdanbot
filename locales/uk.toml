[menu]
main = '''
*✋ Привіт!* Я бот з блекджеком та банами. Можу банити, отримувати інформацію з деяких сервісів, шукати підора дня, та також бути нотатником'''
network = '''
*Онлайн-ресурси*

`/wget [посилання]` — інформація про швидкість завантаження сторінки
`/preview [посилання на ютуб відео]` — завантажує прев'ю з ютубу
`/t[код країни (ru, uk, en, de)] [попит]` — перекласти текст на обрану мову
`/duck [попит]` — шукати щось на DuckDuckGo
'''
wiki = '''
*Вікіпедія*

`/wiki[код країни (ru, uk, en, de)] [попит]` — отримати статтю з вікіпедії
`/s [попит]` — пошук по вікі (як альтернатива — інлайн бота) 🇷🇺

`/lurk [попит]` — Луркомор'є 🇷🇺
`/fallout [попит]` — Сховище, вікі про Fallout 🇷🇺
`/archwiki [попит]` — вікі з актуальною інфою про Linux 🇺🇸
`/encycl [попит]` — вікі про хвороби 🇷🇺
`/mw [посилання на статтю]` — отримати інфу з вікі

`/meme [попит]` — отримати щось у Мемепедії 🇷🇺
`/scp [scp-object]` — отримати SCP об'єкт з SCPFoundation 🇷🇺
'''
system = '''
*Системні команди*

`/status` — Статус бота

`/settings_beta` — налаштування
`/modules_beta` — керування модулями боту
'''
ffmpeg = """
*Відео-редактор* на базі ffmpeg
всі команд потребують реплаю на медіаналіпк, гіфку, відео

`/to_gif` — перетворити у гіф
`/fast` — прискорити
`/slow` — сповільнити
`/reverse` — отреверсити
`/p{4,8,14}` — перетворити відео та звук у пікселізовані
`/jam` — створити відео низької якості
`/mirror` — перевернути горизонтально
"""
admin = '''
*Керування чятом*

`/mute [термін] [причина]` — замутити людину
`/unmute [причина]` — розмутити людину
`/selfmute [термін] [причина]` — самозамутитись

`/warn [причина]` — попередити людину
`/unwarn` — зняти останнє попередження з людини

`/kick` — видалити з группи

`/poll [питання]` — зробити опитування 🇷🇺
`/open` — зробити опитування неанонімним
'''
notes = '''
*Нотатки*

`/get [ключ]` — отримати нотатку
`/set [ключ] [значення]` — створити нотатку
`/remove [ключ]` — видалити нотатку
`/show` — показати усі нотатки

Також можна користуватися нотатками через інший інтерфейс:
`#[ключ]` — отримати нотатку
`#[ключ] [значення]` — створити нотатку
'''
pidor = '''
*Підор дня*

`/pidor` — виявити підора дня, або показати результати цього дня
`/pidorreg` — зареєструватися у грі
`/pidorstats` — топ-10 підорів чяту

P.S. Результати оновлюються о півночі по МСК
'''

