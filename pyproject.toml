[project]
name = "jdanbot"
version = "4.0.0.b2"
description = "Multifunctional Telegram Bot for banning and stuff."
authors = [
  { name = "Daniel Zakharov", email = "gzdan734@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.27.0",
  "art>=6.2",
  "pyduckgo",
  "emoji>=1.6.1",
  "humanize>=4.1.0",
  "pytimeparse2>=1.7.1",
  "python-ffmpeg>=2.0.12",
  "shellous>=0.36.0",
  "aiopytesseract>=0.14.0",
  "tghtml>=2.0.1",
  "iso639-lang>=2.2.3",
  "whenever>=0.10.0",
  "rich>=14.3.2",
  "wikipya",
  "msgspec[toml]>=0.20.0",
  "aiosql>=15.0",
  "aiosqlite>=0.22.1",
  "cysqlite>=0.2.2",
  "pypika>=0.51.1",
  "roman>=5.2",
  "pymemeru",
]

[dependency-groups]
dev = [
  "deptry>=0.24.0",
  "faker>=35.0.0",
  "pytest-asyncio>=0.25.2",
  "pytest-modern>=0.7.4",
  "pytest>=8.3.4",
]

[tool.pyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
addopts = "-p no:warnings"
norecursedirs = ".svn _build tmp*"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 60

[tool.ruff.lint]
extend-select = [
  "F",      # pyflakes
  "I",      # isort
  "FURB",   # refurb
]

[tool.uv.sources]
wikipya = { git = "https://github.com/jdan735/wikipya", branch = "dev" }
pymemeru = { git = "https://github.com/jdan735/pymemeru", branch = "main" }
tghtml = { git = "https://github.com/jdan735/tghtml", branch = "dev" }
pyduckgo = { git = "https://github.com/jdan735/pyduckgo", branch = "main" }
# tghtml = { path = "../tghtml" }
# wikipya = { path = "../wikipya" }
# pymemeru = { path = "../pymemeru" }

[tool.uv]
default-groups = []
