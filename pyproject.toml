[tool.poetry]
name = "jdanbot"
version = "4.0.0a1"
description = "Multifunctional Telegram Bot for banning and stuff."
authors = ["Daniel Zakharov <gzdan734@gmail.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.5.0"
aioschedule = "^0.5.2"
art = "^5.4"
beautifulsoup4 = "^4.10.0"
coloredlogs = "^15.0.1"
httpx = "^0.21.3"
lxml = "^4.7.1"
psutil = "^5.9.0"
pyduckgo = "^0.2.0"
emoji = "^1.6.1"
deep-translator = "=1.8.3"
distro = "^1.7.0"
humanize = "^4.1.0"
pytimeparse = "^1.1.8"
pytesseract = "^0.3.10"
ffmpeg-python = "^0.2.0"
tghtml = "1.1.4"
wikipya = "^4.0.6"
cached-property = "^1.5.2"
toml = "^0.10.2"
async-property = "^0.2.2"
pydantic-settings = "^2.2.1"
pymemeru = "^0.2.0.post1"
orjson = "^3.10.1"
piccolo = {extras = ["sqlite"], version = "^1.5.0"}
arrow = "^1.3.0"
fluentogram = "^1.1.6"

[tool.poetry.dev-dependencies]
pytest-asyncio = "^0.16.0"
bandit = "^1.7.4"

[tool.poetry.group.dev.dependencies]
pytest = "^7.2.0"
mypy = "^1.10.0"

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[tool.ruff]
# Allow lines to be as long as 120.
line-length = 70

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
