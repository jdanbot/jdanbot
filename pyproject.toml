[project]
name = "jdanbot"
version = "4.0.0.a8"
description = "Multifunctional Telegram Bot for banning and stuff."
authors = ["Daniel Zakharov <gzdan734@gmail.com>"]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiogram>=3.21.0",
  "art>=6.2",
  "beautifulsoup4>=4.10.0",
  "coloredlogs>=15.0.1",
  "httpx>=0.27.2",
  "lxml>=5.4.0",
  "pyduckgo>=0.2.0",
  "emoji>=1.6.1",
  "deep-translator>=1.11.4",
  "distro>=1.7.0",
  "humanize>=4.1.0",
  "pytimeparse>=1.1.8",
  "ffmpeg-python>=0.2.0",
  "wikipya>=4.1.0",
  "toml>=0.10.2",
  "pydantic-settings>=2.2.1",
  "pymemeru==0.2.3",
  "shellous>=0.36.0",
  "aiopytesseract>=0.14.0",
  "tghtml>=1.2.0",
  "tortoise-orm>=0.25.1",
  "pendulum>=3.1.0",
  "wikitextparser>=0.55.13",
  "wikitexthtml>=1.2.0",
  "pyquery>=2.0.1",
  "iso639-lang>=2.2.3",
  "perfect-eval>=0.0.10",
  "pydantic-extra-types>=2.10.1",
  "orjson>=3.10.13",
  "rich>=13.9.4",
  "readability-lxml>=0.8.1",
  "lxml-html-clean>=0.4.1",
  "async-property>=0.2.2",
  "arrow>=1.3.0",
  "pypika-tortoise>=0.6.1",
  "pytils>=0.4.4",
  "bleach>=6.3.0",
]

[dependency-groups]
dev = [
  "faker>=35.0.0",
  "pytest-asyncio>=0.25.2",
  "pytest-clarity>=1.0.1",
  "pytest-sugar>=1.0.0",
  "pytest>=8.3.4",
]

[tool.pyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
addopts = "-p no:warnings"
norecursedirs = ".svn _build tmp*"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 60

[tool.ruff.lint]
extend-select = [
  "F",  # pyflakes
  "I",  # isort
  "FURB",  # refurb
]

[tool.tombi]
exclude = ["**/*.toml"]
