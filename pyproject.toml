[project]
name = "jdanbot"
version = "4.0.0.a10"
description = "Multifunctional Telegram Bot for banning and stuff."
authors = [
  { name = "Daniel Zakharov", email = "gzdan734@gmail.com" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "aiogram>=3.25.0",
  "art>=6.2",
  "beautifulsoup4>=4.14.2",
  "lxml>=6.0.0",
  "pyduckgo",
  "emoji>=1.6.1",
  "distro>=1.7.0",
  "humanize>=4.1.0",
  "pytimeparse>=1.1.8",
  "python-ffmpeg>=2.0.12",
  "pydantic-settings>=2.2.1",
  # "pymemeru==0.2.4",
  "shellous>=0.36.0",
  "aiopytesseract>=0.14.0",
  "tghtml>=1.2.0",
  "tortoise-orm>=1.1.5",
  "pendulum>=3.1.0",
  "pyquery>=2.0.1",
  "iso639-lang>=2.2.3",
  "pydantic-extra-types>=2.10.1",
  "async-property>=0.2.2",
  # "arrow>=1.3.0",
  "pypika-tortoise>=0.6.3",
  "bleach>=6.3.0",
  # "whenever>=0.9.5",
  "rich>=14.3.2",
  "wikipya",
  "msgspec[toml]>=0.20.0",
  "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
  "faker>=35.0.0",
  "pytest-asyncio>=0.25.2",
  "pytest-sugar>=1.0.0",
  "pytest>=8.3.4",
]

[tool.pyright]
reportUnusedCallResult = false

[tool.pytest.ini_options]
addopts = "-p no:warnings"
norecursedirs = ".svn _build tmp*"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 60

[tool.ruff.lint]
extend-select = [
  "F",      # pyflakes
  "I",      # isort
  "FURB",   # refurb
]

[tool.uv.sources]
wikipya = { git = "https://github.com/jdan735/wikipya", branch = "dev" }
pyduckgo = { git = "https://github.com/jdan735/pyduckgo" }

[tool.uv]
default-groups = []
