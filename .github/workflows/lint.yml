name: Run Python Tests

on: [ push ]
jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
        cache: "pip"

    - name: Install ruff != 16
      run: pip install "ruff<0.16"
    - name: Type check with ruff
      run: ruff check bot
